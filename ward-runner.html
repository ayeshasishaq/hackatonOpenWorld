  if(e.code==='Tab'){ e.preventDefault(); topView=true; }
  if(e.code==='Escape' && state==='play'){ pauseGame(); }
  if((e.code==='Space'||e.code==='KeyE') && state==='play'){ e.preventDefault(); chirp(); }
  if(e.code==='KeyR' && (state==='play'||state==='over')){ resetGame(); state='play'; overlay.classList.add('hidden'); }
});
addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==='Tab'){ e.preventDefault(); topView=false; } });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; if(state==='play') pauseGame(); });

let hadLock=false, dragging=false;
function grabMouse(){
  const p = scene.requestPointerLock && scene.requestPointerLock();
  if(p && p.catch) p.catch(()=>{});           // pointer lock unavailable → drag-to-look fallback
}
scene.addEventListener('click',()=>{ if(state==='play' && !document.pointerLockElement) grabMouse(); });
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement===scene){ hadLock=true; }
  else if(hadLock && state==='play'){ hadLock=false; pauseGame(); }
});
scene.addEventListener('mousedown',()=>{ if(!document.pointerLockElement) dragging=true; });
addEventListener('mouseup',()=>{ dragging=false; });
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===scene) mouseDX+=e.movementX;
  else if(dragging && state==='play') mouseDX+=e.movementX*1.6;
});

function chirp(){
  if(chirpCd>0) return;
  chirpCd=1.8; sfxChirp();
  const dirx=Math.cos(player.ang), diry=Math.sin(player.ang);
  let moved=0, inRange=0;
  for(const h of humans){
    if(h.isFare) continue;
    const dx=h.x-player.x, dy=h.y-player.y, d=Math.hypot(dx,dy);
    if(d<4.5){
      inRange++;
      const dot=(dx*dirx+dy*diry)/(d||1);
      if(dot>0.1 || d<1.6){
        h.yield=1.6; h.wait=0;
        if(h.state==='sit'){ continue; }
        moved++;
        if(Math.random()<0.35){ h.say=pick(['oh — sorry!','go ahead','little robot!','after you']); h.sayT=1.8; }
      }
    }
  }
  TEL.chirp(inRange, moved);
  if(moved) toast('“Excuse me, coming through.” — '+moved+' yielded','warn');
}

/* -------------------------------------------------------------- game logic */
function updatePlayer(dt){
  const carry = carrying();
  const heavy = carry && task.mobility==='trolley';
  // look — a loaded trolley swings wide, so turning is slower
  const turnScale = carry ? (heavy?0.62:0.78) : 1;
  const angBefore = player.ang;
  if(mouseDX){ player.ang += mouseDX*0.0022*turnScale; mouseDX=0; }
  const turn = (keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);
  player.ang += turn*3.1*turnScale*dt;

  const sprint = keys.ShiftLeft||keys.ShiftRight;
  let fwd = (keys.KeyW||keys.ArrowUp?1:0) - (keys.KeyS||keys.ArrowDown?1:0);
  let str = (keys.KeyD?1:0) - (keys.KeyA?1:0);
  if(player.stun>0){ fwd*=0.15; str*=0.15; }

  const loadScale = carry ? (heavy?0.78:0.86) : 1;
  const maxSpd = (sprint?5.10:3.10) * loadScale / M_PER_CELL;   // cells/s
  const dirx=Math.cos(player.ang), diry=Math.sin(player.ang);
  const tx = (dirx*fwd - diry*str), ty = (diry*fwd + dirx*str);
  const tl = Math.hypot(tx,ty)||1;
  const desireX = (fwd||str) ? tx/tl*maxSpd : 0;
  const desireY = (fwd||str) ? ty/tl*maxSpd : 0;
  const accel = ((fwd||str) ? 7.5 : 9.5) * (carry ? (heavy?0.55:0.7) : 1);
  player.vx = lerp(player.vx, desireX, clamp(accel*dt,0,1));
  player.vy = lerp(player.vy, desireY, clamp(accel*dt,0,1));

  const bx=player.x, by=player.y;
  // Geometry stays forgiving when loaded — the trolley's bulk is felt against people
  // (see playerRadius) rather than by snagging every doorframe.
  const rad = carry ? 0.36 : R_ROBOT;
  slideMove(player, player.vx*dt, player.vy*dt, rad);

  // caught on a doorframe corner? ease back out instead of grinding there forever
  const wanted=Math.hypot(player.vx*dt, player.vy*dt);
  const got=Math.hypot(player.x-bx, player.y-by);
  player.wedge = (wanted>0.006 && got<wanted*0.25) ? (player.wedge||0)+dt : 0;
  if(player.wedge>0.25){
    const [ex,ey]=escapeVector(player.x, player.y, rad);
    const el=Math.hypot(ex,ey);
    if(el>1e-4){
      const s=Math.min(1.6*dt, 0.06)/el;
      if(!blocked(player.x+ex*s, player.y, rad)) player.x+=ex*s;
      if(!blocked(player.x, player.y+ey*s, rad)) player.y+=ey*s;
    }
  }
  player.speed = Math.hypot(player.vx,player.vy);
  player.bob += player.speed*dt*4.0;

  // scraping the trolley along a doorframe is its own kind of failure
  if(joltCd>0) joltCd-=dt;
  if(carry && joltCd<=0){
    if(wanted>0.012 && got < wanted*0.45){
      joltCd=1.2; TEL.jolt(); comfortHit(7, pick(['ooh — the wall','mind the doorframe','careful, careful']));
      player.shake=Math.max(player.shake,0.5); tone(90,.14,'sawtooth',.05);
    }
  }
  // rough handling: speed and hard cornering unsettle the patient
  if(carry){
    const spin=Math.abs(Math.atan2(Math.sin(player.ang-angBefore),Math.cos(player.ang-angBefore)))/Math.max(dt,1e-3);
    let drain=0;
    if(sprint && player.speed>0.6) drain += 3.2;
    if(spin>2.6) drain += (spin-2.6)*2.0;
    if(drain) task.comfort=Math.max(0, task.comfort-drain*dt);
    else if(player.speed<0.95) task.comfort=Math.min(100, task.comfort+1.6*dt);
    if(task.comfort<35 && Math.random()<dt*0.20) patientSays(pick(['please, slower','I feel queasy','not so fast']));
  }

  if(player.stun>0) player.stun-=dt;
  if(player.shake>0) player.shake=Math.max(0,player.shake-dt*2.4);
  if(chirpCd>0) chirpCd-=dt;
  if(patientSayT>0) patientSayT-=dt;
}

function comfortHit(amount,msg){
  if(!carrying()) return;
  task.comfort=Math.max(0, task.comfort-amount);
  if(msg) patientSays(msg);
}

function humanTarget(h){
  const c=randomOpenCell();
  const p=findPath(Math.floor(h.x),Math.floor(h.y),c.x,c.y);
  if(p&&p.length){ h.path=p; h.pi=0; } else { h.path=null; h.wait=rnd(.5,2); }
}

function updateHumans(dt){
  nearestDist=99;
  for(const h of humans){
    h.bob += dt*7;
    if(h.sayT>0) h.sayT-=dt;
    if(h.hitCd>0) h.hitCd-=dt;
    if(h.missCd>0) h.missCd-=dt;
    if(h.yield>0) h.yield-=dt;

    let mvx=0, mvy=0;

    if(h.isFare){                       // the patient you've been sent to collect: waits, never budges
      h.speed=0;
      if(!h.greeted && Math.hypot(h.x-player.x,h.y-player.y)<3.2){
        h.greeted=true; h.say=pick(['about time!','over here','ready when you are','hello there']); h.sayT=2.6;
      }
      continue;
    }

    if(h.state==='sit'){
      h.wait-=dt;
      if(h.wait<=0){ h.state='walk'; h.chair=null; h.wait=0; }
    } else {
      if(h.wait>0){ h.wait-=dt; }
      else{
        if(!h.path || h.pi>=h.path.length) humanTarget(h);
        if(h.path && h.pi<h.path.length){
          const wp=h.path[h.pi];
          const dx=wp.x-h.x, dy=wp.y-h.y, d=Math.hypot(dx,dy);
          if(d<0.28){ h.pi++; }
          else { mvx=dx/d; mvy=dy/d; }
        }
      }
    }

    // local avoidance: other humans
    for(const o of humans){
      if(o===h) continue;
      const dx=h.x-o.x, dy=h.y-o.y, d2=dx*dx+dy*dy;
      if(d2<1.44 && d2>0.0001){
        const d=Math.sqrt(d2), w=(1.2-d)/1.2;
        mvx += dx/d*w*1.1; mvy += dy/d*w*1.1;
      }
    }
    // avoid the robot (they notice it a bit late — that's the game)
    const pdx=h.x-player.x, pdy=h.y-player.y, pd=Math.hypot(pdx,pdy);
    if(pd<nearestDist) nearestDist=pd;
    const notice = (h.yield>0?2.6:1.35) * (h.kind==='patient'?0.8:1);
    if(pd<notice && pd>0.001){
      const w=(notice-pd)/notice * (h.yield>0?2.4:1.25);
      mvx += pdx/pd*w; mvy += pdy/pd*w;
    }

    const ml=Math.hypot(mvx,mvy);
    if(ml>0.001){
      const spd = h.base * (h.urgent?1.7:1) * (h.yield>0?1.25:1);
      mvx=mvx/ml*spd; mvy=mvy/ml*spd;
      h.dirx=mvx; h.diry=mvy; h.speed=spd;
      const bx=h.x, by=h.y;
      slideMove(h, mvx*dt, mvy*dt, h.rad);
      const prog=Math.hypot(h.x-bx,h.y-by);
      h.stuck = prog < spd*dt*0.35 ? h.stuck+dt : 0;
      if(h.stuck>1.1){ h.path=null; h.stuck=0; h.wait=rnd(.2,.8); }
    } else h.speed=0;

    // collision with the robot — a loaded trolley sweeps a wider path
    const rr=playerRadius()+h.rad;
    if(pd < rr && h.hitCd<=0){
      h.hitCd=2.2; onCollision(h, pd);
    } else if(pd < rr+0.55 && h.missCd<=0 && player.speed>1.2){
      h.missCd=2.5; nearMisses++;
      if(Math.random()<0.35){ h.say=pick(['whoa','careful!','easy there','hm!']); h.sayT=1.4; }
    }
  }
}

function onCollision(h, pd){
  collisions++;
  time=Math.max(0, time-5);
  player.stun=0.55; player.shake=1;
  player.vx*=-0.5; player.vy*=-0.5;
  sfxHit();
  fadeEl.style.opacity='0.34';
  setTimeout(()=>fadeEl.style.opacity='0',110);
  h.say=pick(h.kind==='patient'
    ? ['ow!','watch it!','oh my—','careful!']
    : ['hey! watch it','robot! move','are you serious','ugh — again?','incident report!']);
  h.sayT=2.2;
  comfortHit(18, pick(['ow!','my hip!','oh — steady','honestly…']));
  // push the human back out of the robot
  const dx=h.x-player.x, dy=h.y-player.y, d=pd||0.01;
  slideMove(h, dx/d*0.22, dy/d*0.22, h.rad);
  toast('COLLISION with '+labelFor(h)+' — −5s'+(carrying()?' · patient jostled':''), 'bad');
}
function labelFor(h){
  return {nurse:'a nurse',doctor:'a physician',surgeon:'a surgeon',
          patient:'a patient',janitor:'housekeeping',visitor:'a visitor'}[h.kind]||'a human';
}

function updateTask(dt){
  const need = task.phase==='pickup' ? 1.8 : 1.5;   // seconds to load / hand over
  const d=Math.hypot(goal.x-player.x, goal.y-player.y);
  if(d<1.25 && player.speed<0.9){
    dwell += dt;
    if(dwell>=need){
      dwell=0;
      if(task.phase==='pickup') loadPatient(); else dropPatient();
    }
  } else dwell=Math.max(0, dwell-dt*1.6);
  document.getElementById('barf').style.width=(dwell/need*100)+'%';
}

function loadPatient(){
  const i=humans.indexOf(task.patient);
  if(i>=0) humans.splice(i,1);
  task.phase='drop';
  TEL.legEnd();
  setTarget(task.dept.x, task.dept.y, task.dept.name, SPR.markerDrop);
  TEL.legStart();
  taskCard();
  sfxDeliver();
  const credit=DIFFS[difficulty].pickup;
  time += credit;
  toast(task.name+' aboard — to '+task.dept.name+'  +'+credit+'s','good');
  patientSays(pick(['thank you','right then','gently, please','off we go']),3);
}

function dropPatient(){
  transfers++;
  const care = task.comfort;
  careTotal += care;
  TEL.legEnd(); TEL.comforts.push(Math.round(care));
  const bonus = Math.round(DIFFS[difficulty].add * (0.60 + 0.40*care/100));
  time += bonus;
  sfxDeliver();
  toast(task.name+' handed over at '+task.dept.name+
        '  +'+bonus+'s · comfort '+Math.round(care)+'%', care>70?'good':'warn');
  patientSays(care>75 ? pick(['smooth ride, thanks','very good, thank you'])
                      : care>40 ? 'well… we made it'
                      : pick(['never again','I want a different porter']), 3);
  spawnCrowd(DIFFS[difficulty].spawn);
  newTask(); TEL.legStart();
  if(Math.random()<0.45) urgentRun();   // a stat call clears the corridor the hard way
}

function urgentRun(){
  const cell=randomOpenCell();
  const h=makeHuman(cell,{kind:'surgeon'});
  h.urgent=true; humans.push(h);
  const p=makeHuman(cell,{kind:'nurse'}); p.urgent=true; humans.push(p);
  toast('Stat call — staff moving fast in the corridors','warn');
}

/* ================================================================ RENDERING */
function resize(){
  const dpr=Math.min(devicePixelRatio||1, 2);
  const cw=Math.max(320, innerWidth||320), ch=Math.max(240, innerHeight||240);
  RW = clamp(Math.round(cw/3.2), 260, 520);
  RH = Math.round(RW * ch/cw);
  if(!isFinite(RH)) RH=225;
  RH = clamp(RH, 150, 340);
  scene.width=RW; scene.height=RH;
  img = sctx.createImageData(RW,RH);
  buf = new Uint32Array(img.data.buffer);
  zbuf = new Float32Array(RW);
  VS = (RW/2)/PLANE;
  hud.width=Math.round(cw*dpr); hud.height=Math.round(ch*dpr);
  hctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);

function render(){
  if(!buf || scene.width!==RW) resize();
  const dirX=Math.cos(player.ang), dirY=Math.sin(player.ang);
  const planeX=-dirY*PLANE, planeY=dirX*PLANE;
  const shake = player.shake>0 ? Math.sin(performance.now()*0.06)*player.shake*7 : 0;
  const bob = Math.sin(player.bob)*2.1*Math.min(1,player.speed*0.8);
  const horizon = RH*0.5 + bob + shake;
  const eye = EYE + Math.sin(player.bob*0.5)*0.012;

  /* ---- floor & ceiling ------------------------------------------------- */
  const rdx0=dirX-planeX, rdy0=dirY-planeY, rdx1=dirX+planeX, rdy1=dirY+planeY;
  const fr=FOG[0], fg=FOG[1], fb=FOG[2];

  for(let y=0;y<RH;y++){
    const isFloor = y > horizon;
    const p = isFloor ? (y-horizon) : (horizon-y);
    if(p < 0.5){ // horizon band -> fog
      const row=y*RW, c=pack(fr,fg,fb);
      for(let x=0;x<RW;x++) buf[row+x]=c;
      continue;
    }
    const dist = (isFloor ? eye : (WALL_H-eye)) * VS / p;
    if(dist>34){ const row=y*RW, c=pack(fr,fg,fb); for(let x=0;x<RW;x++) buf[row+x]=c; continue; }
    let fx = player.x + dist*rdx0, fy = player.y + dist*rdy0;
    const stepX=(dist*rdx1 - dist*rdx0)/RW, stepY=(dist*rdy1 - dist*rdy0)/RW;
    let f = 3.6/(dist+2.2); if(f>1) f=1;
    const row=y*RW;
    for(let x=0;x<RW;x++){
      const cx=fx|0, cy=fy|0;
      let t, ff=f;
      if(cx<0||cy<0||cx>=MW||cy>=MH){ t=FTEX[FT_VINYL]; }
      else if(isFloor){ t=FTEX[ftex[cy*MW+cx]]; }
      else {
        const ci=ctex[cy*MW+cx]; t=CTEX[ci];
        if(ci===CT_LIGHT){ ff=Math.max(f,0.78); }
      }
      const tx=((fx-cx)*TS)&63, ty=((fy-cy)*TS)&63;
      const c=t.px[(ty<<6)+tx];
      const r=(c&255)*ff + fr*(1-ff);
      const g=((c>>8)&255)*ff + fg*(1-ff);
      const b=((c>>16)&255)*ff + fb*(1-ff);
      buf[row+x]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
      fx+=stepX; fy+=stepY;
    }
  }

  /* ---- walls ----------------------------------------------------------- */
  for(let x=0;x<RW;x++){
    const camX = 2*x/RW - 1;
    const rdx = dirX + planeX*camX, rdy = dirY + planeY*camX;
    let mapX=player.x|0, mapY=player.y|0;
    const ddx = rdx===0?1e30:Math.abs(1/rdx), ddy = rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){ stepX=-1; sdx=(player.x-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-player.x)*ddx; }
    if(rdy<0){ stepY=-1; sdy=(player.y-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-player.y)*ddy; }
    let side=0, hit=0, guard=0;
    while(!hit && guard++<128){
      if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; } else { sdy+=ddy; mapY+=stepY; side=1; }
      if(mapX<0||mapY<0||mapX>=MW||mapY>=MH){ hit=2; break; }
      if(grid[mapY*MW+mapX]) hit=1;
    }
    let dist = hit===1 ? (side===0 ? (sdx-ddx) : (sdy-ddy)) : 40;
    if(dist<0.02) dist=0.02;
    zbuf[x]=dist;
    if(hit!==1) continue;

    const t = TEX[wtex[mapY*MW+mapX]] || TEX[TX_WALL];
    let wallX = side===0 ? player.y + dist*rdy : player.x + dist*rdx;
    wallX -= Math.floor(wallX);
    let texX = (wallX*TS)|0;
    if((side===0 && rdx>0) || (side===1 && rdy<0)) texX = TS-texX-1;
    texX &= 63;

    const scale = VS/dist;
    const yTop = horizon + (eye-WALL_H)*scale;
    const yBot = horizon + eye*scale;
    const h = yBot-yTop;
    let y0=Math.ceil(yTop), y1=Math.floor(yBot);
    if(y0<0) y0=0; if(y1>RH-1) y1=RH-1;

    let f = 3.6/(dist+2.2); if(f>1) f=1;
    if(side===1) f*=0.78;
    const tStep = TS/h;
    let tPos = (y0 - yTop)*tStep;
    for(let y=y0;y<=y1;y++){
      const ty=tPos|0; tPos+=tStep;
      const c=t.px[((ty>63?63:ty<0?0:ty)<<6)+texX];
      const r=(c&255)*f + fr*(1-f);
      const g=((c>>8)&255)*f + fg*(1-f);
      const b=((c>>16)&255)*f + fb*(1-f);
      buf[y*RW+x]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
    }
  }

  /* ---- sprites --------------------------------------------------------- */
  const list=[];
  for(const p of propList) list.push({s:p.s,x:p.x,y:p.y,h:p.h,base:p.base||0,glow:0});
  for(const h of humans){
    h._sx=undefined;
    const bobY = h.speed>0.05 ? Math.abs(Math.sin(h.bob*2))*0.03 : 0;
    list.push({s:h.spr,x:h.x,y:h.y,h:h.hgt+bobY,base:0,glow:0,ent:h});
  }
  if(marker) list.push({s:marker.spr, x:marker.x, y:marker.y, h:2.0, base:0,
                        glow:0.55+0.45*Math.sin(performance.now()*0.005)});
  for(const s of list){ const dx=s.x-player.x, dy=s.y-player.y; s.d=dx*dx+dy*dy; }
  list.sort((a,b)=>b.d-a.d);

  const invDet = 1/(planeX*dirY - dirX*planeY);
  for(const s of list){
    if(s.d>1200) continue;
    const spx=s.x-player.x, spy=s.y-player.y;
    const tX = invDet*(dirY*spx - dirX*spy);
    const tY = invDet*(-planeY*spx + planeX*spy);
    if(tY<0.12) continue;
    const scale=VS/tY;
    const scrX=(RW/2)*(1+tX/tY);
    const hpx = s.h*scale;
    const wpx = hpx*(s.s.w/s.s.h);
    const yBot = horizon + (eye - (s.base||0))*scale;
    const yTop = yBot - hpx;
    let x0=Math.ceil(scrX-wpx/2), x1=Math.floor(scrX+wpx/2);
    let y0=Math.ceil(yTop), y1=Math.floor(yBot);
    if(x1<0||x0>=RW||y1<0||y0>=RH) continue;
    const cx0=Math.max(0,x0), cx1=Math.min(RW-1,x1);
    const cy0=Math.max(0,y0), cy1=Math.min(RH-1,y1);
    let f = 3.6/(Math.sqrt(s.d)+2.2); if(f>1) f=1;
    if(s.glow) f=Math.max(f, s.glow);
    const sw=s.s.w, sh=s.s.h, px=s.s.px;
    const txStep = sw/(x1-x0+1), tyStep = sh/(y1-y0+1);
    for(let x=cx0;x<=cx1;x++){
      if(tY >= zbuf[x]) continue;
      const tx=((x-x0)*txStep)|0;
      if(tx<0||tx>=sw) continue;
      for(let y=cy0;y<=cy1;y++){
        const ty=((y-y0)*tyStep)|0;
        if(ty<0||ty>=sh) continue;
        const c=px[ty*sw+tx];
        const a=c>>>24;
        if(a<10) continue;
        let r=(c&255)*f + fr*(1-f);
        let g=((c>>8)&255)*f + fg*(1-f);
        let b=((c>>16)&255)*f + fb*(1-f);
        if(a<250){                                  // translucent: blend with what's behind
          const d=buf[y*RW+x], k=a/255, ik=1-k;
          r=r*k + (d&255)*ik; g=g*k + ((d>>8)&255)*ik; b=b*k + ((d>>16)&255)*ik;
        }
        buf[y*RW+x]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
      }
    }
    if(s.ent) { s.ent._sx=scrX; s.ent._sy=yTop; s.ent._sc=scale; }
  }

  sctx.putImageData(img,0,0);
}

/* ==================================================================== HUD */
function drawHUD(){
  const W=Math.max(320, innerWidth||320), H=Math.max(240, innerHeight||240);
  hctx.clearRect(0,0,W,H);

  // vignette
  const vg=hctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  hctx.fillStyle=vg; hctx.fillRect(0,0,W,H);

  if(state!=='play' && state!=='pause') return;

  // ---- speech bubbles
  const sx=W/RW, sy=H/RH;
  hctx.textAlign='center'; hctx.font='600 12px ui-monospace,monospace';
  for(const hm of humans){
    if(hm.sayT>0 && hm._sx!==undefined){
      const x=hm._sx*sx, y=hm._sy*sy - 8;
      if(x<-60||x>W+60||y<0||y>H) continue;
      const tw=hctx.measureText(hm.say).width+16;
      const a=clamp(hm.sayT,0,1);
      hctx.globalAlpha=a;
      hctx.fillStyle='rgba(14,20,28,.9)'; hctx.strokeStyle='rgba(125,220,255,.35)';
      roundRect(hctx,x-tw/2,y-20,tw,20,6); hctx.fill(); hctx.stroke();
      hctx.fillStyle='#dce8f2'; hctx.fillText(hm.say,x,y-6);
      hctx.globalAlpha=1;
    }
  }

  // ---- robot chassis (cargo deck)
  drawChassis(W,H);

  // ---- goal direction arrow
  const gdx=goal.x-player.x, gdy=goal.y-player.y;
  const ga=Math.atan2(gdy,gdx)-player.ang;
  const rel=Math.atan2(Math.sin(ga),Math.cos(ga));
  const cxp=W/2, cyp=H*0.13;
  const off=clamp(rel/(FOV/2), -1.35, 1.35)*(W*0.36);
  hctx.save();
  hctx.translate(cxp+off, cyp);
  const behind=Math.abs(rel)>FOV/2;
  hctx.rotate(behind ? (rel>0? Math.PI/2 : -Math.PI/2) : 0);
  hctx.fillStyle=behind?'rgba(255,204,102,.85)':'rgba(125,220,255,.9)';
  hctx.beginPath(); hctx.moveTo(0,-9); hctx.lineTo(9,7); hctx.lineTo(-9,7); hctx.closePath(); hctx.fill();
  hctx.restore();

  // ---- proximity radar (bottom-left)
  drawRadar(W,H);

  // ---- top-down tactical view
  if(topView) drawTopView(W,H);

  // ---- chirp cooldown pip
  hctx.textAlign='center'; hctx.font='11px ui-monospace,monospace';
  hctx.fillStyle= chirpCd>0 ? 'rgba(125,140,155,.6)' : 'rgba(125,220,255,.9)';
  hctx.fillText(chirpCd>0? 'SPACE  ▮ recharging' : 'SPACE  ◉ announce', W/2, H-16);
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

function drawChassis(W,H){
  const deckH=Math.min(200, H*0.30), y=H-deckH;
  const sway=Math.sin(player.bob)*3*Math.min(1,player.speed*0.8);
  const roll=Math.sin(player.bob*0.5)*0.012*Math.min(1,player.speed*0.7);
  const carry=carrying();
  hctx.save(); hctx.translate(0, sway);

  // whatever the porter is pushing, drawn receding away from the camera
  hctx.save(); hctx.translate(W/2,H); hctx.rotate(roll); hctx.translate(-W/2,-H);
  const f={cx:W/2, topY:y-deckH*0.24, botY:H+30, topHalf:W*0.150, botHalf:W*0.330};
  if(carry && task.mobility==='chair') drawWheelchair(f,W,H);
  else if(carry)                       drawTrolley(f,W,H);
  else                                 drawEmptyTrolley(f,W,H);
  hctx.restore();

  // the robot's own handlebar deck, closest to the camera
  const g=hctx.createLinearGradient(0,H-deckH*0.22,0,H);
  g.addColorStop(0,'#20303c'); g.addColorStop(1,'#0b1219');
  hctx.fillStyle=g;
  hctx.beginPath();
  hctx.moveTo(0,H+10); hctx.lineTo(W*0.13,H-deckH*0.22);
  hctx.lineTo(W*0.87,H-deckH*0.22); hctx.lineTo(W,H+10);
  hctx.closePath(); hctx.fill();
  hctx.strokeStyle='rgba(125,220,255,.20)'; hctx.lineWidth=2; hctx.stroke();

  const lit = nearestDist<0.95 ? '#ff6b6b' : nearestDist<1.9 ? '#ffcc66' : '#5ce39a';
  for(let i=0;i<3;i++){
    hctx.fillStyle = i===0?lit : 'rgba(125,220,255,'+(0.25+0.25*Math.sin(performance.now()*0.004+i))+')';
    hctx.beginPath(); hctx.arc(W*0.17+i*15, H-deckH*0.18, 4.5, 0, 6.29); hctx.fill();
  }

  // what the passenger has to say about your driving
  if(carry && patientSayT>0){
    hctx.globalAlpha=clamp(patientSayT,0,1);
    hctx.textAlign='center'; hctx.font='600 13px ui-monospace,monospace';
    const tw=hctx.measureText(patientSay).width+20;
    const by=f.topY-48;                       // sits clear above the passenger's head
    hctx.fillStyle='rgba(14,20,28,.92)'; hctx.strokeStyle='rgba(255,204,102,.45)';
    roundRect(hctx, W/2-tw/2, by, tw, 24, 7); hctx.fill(); hctx.stroke();
    hctx.fillStyle='#ffeec9'; hctx.fillText(patientSay, W/2, by+17);
    hctx.globalAlpha=1;
  }
  hctx.restore();
}

/* a trapezoid that recedes from the camera: wide at the bottom, narrow at the far end */
function slab(f,t0,t1,inset,fill){
  const L=f.botY-f.topY;
  const y0=f.topY+L*t0, y1=f.topY+L*t1;
  const h0=lerp(f.topHalf,f.botHalf,t0)-inset, h1=lerp(f.topHalf,f.botHalf,t1)-inset;
  hctx.beginPath();
  hctx.moveTo(f.cx-h0,y0); hctx.lineTo(f.cx+h0,y0);
  hctx.lineTo(f.cx+h1,y1); hctx.lineTo(f.cx-h1,y1);
  hctx.closePath(); hctx.fillStyle=fill; hctx.fill();
}
function siderails(f){
  const L=f.botY-f.topY;
  hctx.lineCap='round';
  for(const s of [-1,1]){
    hctx.strokeStyle='#9fadb6'; hctx.lineWidth=6;
    hctx.beginPath();
    hctx.moveTo(f.cx+s*(f.topHalf+6), f.topY+L*0.06);
    hctx.lineTo(f.cx+s*(f.botHalf+10), f.botY);
    hctx.stroke();
    hctx.strokeStyle='rgba(255,255,255,.28)'; hctx.lineWidth=1.6;
    hctx.beginPath();
    hctx.moveTo(f.cx+s*(f.topHalf+6), f.topY+L*0.06-2);
    hctx.lineTo(f.cx+s*(f.botHalf+10), f.botY-3);
    hctx.stroke();
  }
}
function drawEmptyTrolley(f,W,H){
  slab(f,0,1,0,'#33414c');
  slab(f,0.03,1,7,'#c8d2d8');
  siderails(f);
  hctx.fillStyle='rgba(60,74,88,.85)'; hctx.font='11px ui-monospace,monospace'; hctx.textAlign='center';
  hctx.fillText('TROLLEY EMPTY', f.cx, f.topY+(f.botY-f.topY)*0.32);
}
function drawTrolley(f,W,H){
  const L=f.botY-f.topY;
  slab(f,0,1,0,'#33414c');                       // frame
  slab(f,0.03,1,7,'#e7edf1');                    // sheet
  // blanket from mid-body to the near end
  slab(f,0.30,1,11,'#4d6f86');
  hctx.fillStyle='rgba(255,255,255,.10)';
  slab(f,0.30,0.34,11,'rgba(255,255,255,.14)');
  // pillow and head at the far end
  const hy=f.topY+L*0.09, hr=f.topHalf*0.42;
  hctx.fillStyle='#f4f8fb';
  roundRect(hctx, f.cx-f.topHalf*0.80, f.topY+L*0.02, f.topHalf*1.60, L*0.15, 8); hctx.fill();
  hctx.fillStyle=task.skin;
  hctx.beginPath(); hctx.ellipse(f.cx, hy, hr, hr*0.92, 0, 0, 6.29); hctx.fill();
  hctx.fillStyle=task.hair;
  hctx.beginPath(); hctx.ellipse(f.cx, hy-hr*0.55, hr*1.04, hr*0.6, 0, 0, 6.29); hctx.fill();
  hctx.fillStyle='#20242b';
  const eh = task.comfort<45 ? 1.6 : 3.2;        // a wince when the ride gets rough
  hctx.fillRect(f.cx-hr*0.52, hy-1, hr*0.34, eh);
  hctx.fillRect(f.cx+hr*0.18, hy-1, hr*0.34, eh);
  // arms resting on top of the blanket
  hctx.fillStyle=task.skin;
  for(const s of [-1,1]){
    const w=lerp(f.topHalf,f.botHalf,0.42)-18;
    hctx.beginPath();
    hctx.moveTo(f.cx+s*(w-9), f.topY+L*0.29);
    hctx.lineTo(f.cx+s*w,     f.topY+L*0.29);
    hctx.lineTo(f.cx+s*(w+5), f.topY+L*0.52);
    hctx.lineTo(f.cx+s*(w-5), f.topY+L*0.52);
    hctx.closePath(); hctx.fill();
  }
  siderails(f);
  // IV pole on the left, running up out of frame
  hctx.strokeStyle='#9fadb6'; hctx.lineWidth=5;
  hctx.beginPath(); hctx.moveTo(f.cx-f.topHalf-18, f.topY-40); hctx.lineTo(f.cx-f.botHalf-18, f.botY); hctx.stroke();
  hctx.fillStyle='rgba(196,230,244,.9)';
  roundRect(hctx, f.cx-f.topHalf-34, f.topY-96, 26, 52, 5); hctx.fill();
  hctx.fillStyle='rgba(150,205,235,.95)';
  roundRect(hctx, f.cx-f.topHalf-34, f.topY-66, 26, 22, 5); hctx.fill();
}
function drawWheelchair(f,W,H){
  const L=f.botY-f.topY, cx=f.cx;
  const seatTop=f.topY+L*0.34;
  // wheels either side, seen from behind
  hctx.strokeStyle='#1b2229'; hctx.lineWidth=9;
  for(const s of [-1,1]){
    hctx.beginPath();
    hctx.arc(cx+s*f.botHalf*0.92, f.botY-L*0.06, L*0.46, Math.PI*1.08, Math.PI*1.92);
    hctx.stroke();
  }
  // chair back
  hctx.fillStyle='#2b3644';
  roundRect(hctx, cx-f.topHalf*1.5, seatTop, f.topHalf*3, L*0.66, 14); hctx.fill();
  hctx.fillStyle='rgba(255,255,255,.07)'; hctx.fillRect(cx-f.topHalf*1.5, seatTop, f.topHalf*3, 7);
  // push handles
  hctx.strokeStyle='#9fadb6'; hctx.lineWidth=7; hctx.lineCap='round';
  for(const s of [-1,1]){
    hctx.beginPath();
    hctx.moveTo(cx+s*f.topHalf*1.45, seatTop+8);
    hctx.lineTo(cx+s*f.botHalf*0.98, f.botY-L*0.10);
    hctx.stroke();
  }
  // the passenger: shoulders above the backrest, head above that
  const hr=f.topHalf*0.52;
  hctx.fillStyle='#cfe3ea';
  roundRect(hctx, cx-f.topHalf*1.15, seatTop-L*0.14, f.topHalf*2.3, L*0.22, 18); hctx.fill();
  hctx.fillStyle=task.skin;
  hctx.beginPath(); hctx.ellipse(cx, seatTop-L*0.20, hr, hr*0.95, 0, 0, 6.29); hctx.fill();
  hctx.fillStyle=task.hair;
  hctx.beginPath(); hctx.ellipse(cx, seatTop-L*0.245, hr*1.02, hr*0.60, 0, 0, 6.29); hctx.fill();
  if(task.comfort<45){                       // gripping the armrests
    hctx.fillStyle=task.skin;
    roundRect(hctx, cx-f.topHalf*1.58, seatTop+L*0.20, f.topHalf*0.30, L*0.055, 4); hctx.fill();
    roundRect(hctx, cx+f.topHalf*1.28, seatTop+L*0.20, f.topHalf*0.30, L*0.055, 4); hctx.fill();
  }
}

function drawRadar(W,H){
  const R=Math.min(94, H*0.14), cx=24+R, cy=H-24-R;
  hctx.save();
  hctx.globalAlpha=.94;
  hctx.fillStyle='rgba(11,16,22,.86)'; hctx.strokeStyle='rgba(34,48,63,1)'; hctx.lineWidth=1;
  hctx.beginPath(); hctx.arc(cx,cy,R,0,6.29); hctx.fill(); hctx.stroke();
  hctx.save(); hctx.beginPath(); hctx.arc(cx,cy,R-1,0,6.29); hctx.clip();
  const range=9; const k=(R-6)/range;
  // walls near by
  const px=player.x, py=player.y;
  for(let y=Math.floor(py-range);y<=py+range;y++)for(let x=Math.floor(px-range);x<=px+range;x++){
    if(!isWall(x,y)) continue;
    const rx=(x+0.5-px), ry=(y+0.5-py);
    const a=-player.ang-Math.PI/2;
    const tx= rx*Math.cos(a)-ry*Math.sin(a), ty= rx*Math.sin(a)+ry*Math.cos(a);
    hctx.fillStyle='rgba(60,86,110,.55)';
    hctx.fillRect(cx+tx*k-k/2, cy+ty*k-k/2, k, k);
  }
  // sweep
  hctx.strokeStyle='rgba(125,220,255,.18)';
  for(let i=1;i<=3;i++){ hctx.beginPath(); hctx.arc(cx,cy,(R-6)*i/3,0,6.29); hctx.stroke(); }
  // humans
  for(const h of humans){
    const rx=h.x-px, ry=h.y-py; const d=Math.hypot(rx,ry);
    if(d>range) continue;
    const a=-player.ang-Math.PI/2;
    const tx= rx*Math.cos(a)-ry*Math.sin(a), ty= rx*Math.sin(a)+ry*Math.cos(a);
    hctx.fillStyle = d<0.95?'#ff6b6b' : d<2.0?'#ffcc66' : '#7ddcff';
    hctx.beginPath(); hctx.arc(cx+tx*k, cy+ty*k, d<2?3.6:2.8, 0, 6.29); hctx.fill();
  }
  // goal bearing
  const gx=goal.x-px, gy=goal.y-py;
  const a=-player.ang-Math.PI/2;
  let tx= gx*Math.cos(a)-gy*Math.sin(a), ty= gx*Math.sin(a)+gy*Math.cos(a);
  const gl=Math.hypot(tx,ty)||1; const clampL=Math.min(gl, range*0.94);
  tx=tx/gl*clampL; ty=ty/gl*clampL;
  hctx.fillStyle='#5ce39a';
  hctx.beginPath(); hctx.arc(cx+tx*k, cy+ty*k, 3.4, 0, 6.29); hctx.fill();
  // robot
  hctx.fillStyle='#e6edf5';
  hctx.beginPath(); hctx.moveTo(cx,cy-6); hctx.lineTo(cx+5,cy+5); hctx.lineTo(cx-5,cy+5); hctx.closePath(); hctx.fill();
  hctx.restore();
  hctx.fillStyle='rgba(125,139,156,.8)'; hctx.font='9px ui-monospace,monospace'; hctx.textAlign='left';
  hctx.fillText('PROXIMITY '+(range*M_PER_CELL).toFixed(0)+'m', cx-R+4, cy+R-6);
  hctx.restore();
}

function drawTopView(W,H){
  hctx.save();
  hctx.fillStyle='rgba(5,8,11,.90)'; hctx.fillRect(0,0,W,H);
  const k=Math.min((W*0.9)/MW,(H*0.82)/MH);
  const ox=(W-MW*k)/2, oy=(H-MH*k)/2;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=idx(x,y);
    if(grid[i]) { hctx.fillStyle='#243444'; hctx.fillRect(ox+x*k,oy+y*k,k,k); }
    else { hctx.fillStyle= ftex[i]===FT_CARPET?'#141d24':'#0e161d'; hctx.fillRect(ox+x*k,oy+y*k,k,k); }
  }
  for(const p of propList){ hctx.fillStyle='rgba(90,110,130,.5)';
    hctx.fillRect(ox+(p.x-p.r)*k, oy+(p.y-p.r)*k, p.r*2*k, p.r*2*k); }
  for(const h of humans){
    hctx.fillStyle = h.kind==='patient'?'#cfe3ea' : h.kind==='doctor'?'#f2f6f8' : h.kind==='nurse'?'#2f8f8a':'#8e7bb0';
    hctx.beginPath(); hctx.arc(ox+h.x*k, oy+h.y*k, k*0.34, 0, 6.29); hctx.fill();
  }
  hctx.fillStyle='#5ce39a';
  hctx.beginPath(); hctx.arc(ox+goal.x*k, oy+goal.y*k, k*0.6, 0, 6.29); hctx.fill();
  hctx.fillStyle='#7ddcff';
  hctx.save(); hctx.translate(ox+player.x*k, oy+player.y*k); hctx.rotate(player.ang);
  hctx.beginPath(); hctx.moveTo(k*0.8,0); hctx.lineTo(-k*0.5,k*0.5); hctx.lineTo(-k*0.5,-k*0.5);
  hctx.closePath(); hctx.fill(); hctx.restore();
  hctx.fillStyle='rgba(230,237,245,.9)'; hctx.font='12px ui-monospace,monospace'; hctx.textAlign='center';
  hctx.fillText('TACTICAL VIEW · release TAB', W/2, oy+MH*k+22);
  hctx.restore();
}

/* --------------------------------------------------------------- DOM panel */
const el={
  del:document.getElementById('v-del'), dist:document.getElementById('v-dist'),
  distK:document.getElementById('k-dist'), com:document.getElementById('v-com'),
  near:document.getElementById('v-near'), spd:document.getElementById('v-spd'),
  nm:document.getElementById('v-nm'), col:document.getElementById('v-col'),
  head:document.getElementById('telhead'), tel:document.getElementById('tel'),
  clock:document.getElementById('tclock'), clockBox:document.getElementById('clock')
};
let uiT=0;
function updatePanels(dt){
  uiT+=dt; if(uiT<0.08) return; uiT=0;
  const gd=Math.hypot(goal.x-player.x,goal.y-player.y)*M_PER_CELL;
  const nd=nearestDist*M_PER_CELL;
  el.del.textContent=transfers;
  el.distK.textContent = task.phase==='pickup' ? 'dist to patient' : 'dist to '+task.dept.name.split(' ')[0].toLowerCase();
  el.dist.textContent=gd.toFixed(1)+' m';
  if(carrying()){
    const c=Math.round(task.comfort);
    el.com.textContent=c+'%';
    el.com.className='v '+(c<40?'bad':c<75?'warn':'good');
  } else { el.com.textContent='—'; el.com.className='v'; }
  el.near.textContent= nearestDist>20 ? '— m' : nd.toFixed(2)+' m';
  el.near.className='v '+(nd<0.9?'bad':nd<2.0?'warn':'good');
  el.spd.textContent=(player.speed*M_PER_CELL).toFixed(1)+' m/s';
  el.nm.textContent=nearMisses; el.nm.className='v '+(nearMisses>0?'warn':'');
  el.col.textContent=collisions; el.col.className='v '+(collisions>0?'bad':'');
  const st = player.stun>0 ? 'hit' : nd<1.4 ? 'caution' : '';
  el.tel.className = 'panel '+st;
  el.head.textContent = st==='hit' ? 'CONTACT' : st==='caution' ? 'CAUTION · YIELD'
                      : carrying() ? 'PATIENT ABOARD' : 'CLEAR';
  const m=Math.floor(Math.max(0,time)/60), s=Math.floor(Math.max(0,time)%60);
  el.clock.textContent=m+':'+String(s).padStart(2,'0');
  el.clockBox.className='panel'+(time<20?' low':'');
}

function overCard(){
  const care = transfers ? Math.round(careTotal/transfers) : 0;
  const rating = collisions===0 && care>85 ? 'The ward would like to keep you.'
    : collisions<=2 && care>60 ? 'Solid portering. One or two apologies owed.'
    : collisions<=5 ? 'Maintenance has questions about your bumpers.'
    : 'You are being reassigned to the laundry basement.';
  const R=TEL.report();
  const row=(k,v,note)=>`<div class="drow"><span class="dk">${k}</span><span class="dv">${v}</span><span class="dn">${note}</span></div>`;
  const n=(v,suffix)=> v===null||v===undefined ? '—' : v+(suffix||'');
  const sd=R.navigation.mean_speed_by_density_ms;
  const adapt = (sd.none!==null && sd.heavy!==null)
      ? sd.none.toFixed(1)+' → '+sd.heavy.toFixed(1)+' m/s'
      : (sd.none!==null? sd.none.toFixed(1)+' m/s (no dense crowd met)' : '—');

  cardEl.innerHTML=`
    <h1>Shift <span>over</span></h1>
    <div class="tag">${rating}</div>
    <div class="stats">
      <div><span class="k">patients moved</span><span>${transfers}</span></div>
      <div><span class="k">avg comfort</span><span>${transfers?care+'%':'—'}</span></div>
      <div><span class="k">collisions</span><span>${collisions}</span></div>
      <div><span class="k">near-misses</span><span>${nearMisses}</span></div>
      <div><span class="k">distance driven</span><span>${R.distance_m} m</span></div>
      <div><span class="k">difficulty</span><span>${DIFFS[difficulty].label}</span></div>
    </div>

    <div class="dhead">Shift data capture
      <em>${R.trajectory_5hz.length} trajectory samples · ${R.duration_s}s · ${R.encounters} human encounters</em></div>
    <div class="dnote">Simulated numbers, real schema: these are the metrics a physical robot
      deployed in a hospital would be logging, and each one feeds a specific part of the stack.</div>

    <div class="dgroup">Safety &amp; social navigation</div>
    ${row('collisions / 100 m', n(R.collisions_per_100m), 'core safety KPI for fleet release gates')}
    ${row('near-misses / 100 m', n(R.near_misses_per_100m), 'leading indicator — fires long before contact does')}
    ${row('closing TTC &lt; 1.5 s / 100 m', n(R.ttc_under_1s5_per_100m), 'triggers speed-limiter and emergency-stop tuning')}
    ${row('minimum clearance', n(R.min_clearance_m,' m'), 'sets the hard safety envelope in the planner')}
    ${row('encounter clearance p05 / median', n(R.encounter_clearance_p05_m,' m')+' / '+n(R.encounter_clearance_median_m,' m'),
          'distribution, not worst case — what audits actually ask for')}
    ${row('time in personal space', n(R.personal_space_time_pct,'%'),
          'proxemic compliance (Hall zones): the social-acceptance metric')}
    ${row('blind-corner appearances', n(R.blind_corner_appearances),
          'sizes sensor FOV and the occlusion-aware slowdown policy')}

    <div class="dgroup">Human interaction</div>
    ${row('intent signals issued', n(R.intent_signals.issued), 'how often the robot had to announce itself')}
    ${row('human yield rate', n(R.intent_signals.yield_rate===null?null:Math.round(R.intent_signals.yield_rate*100),'%'),
          'does signalling actually change behaviour? drives HRI design')}
    ${row('speed vs crowd density', adapt,
          'the speed-adaptation curve — transfers directly to a real velocity policy')}
    ${row('mean people within 3 m', n(R.navigation.mean_crowd_density_within_3m),
          'characterises the deployment environment for sim-to-real')}

    <div class="dgroup">Payload &amp; ride quality</div>
    ${row('peak lateral acceleration', n(R.ride_quality.peak_lateral_accel_ms2,' m/s²'),
          'ISO 2631 ride comfort, 0.15 s window — the limit for carrying a person')}
    ${row('RMS lateral acceleration', n(R.ride_quality.rms_lateral_accel_ms2,' m/s²'), 'sustained discomfort, not just spikes')}
    ${row('trolley scrapes', n(R.ride_quality.obstruction_jolts),
          'loaded contact with walls and doorframes — clearance margins at chokepoints')}
    ${row('mean comfort score', n(R.ride_quality.mean_comfort_pct,'%'), 'the outcome measure the ward would sign off on')}

    <div class="dgroup">Autonomy robustness</div>
    ${row('path efficiency', n(R.navigation.path_efficiency===null?null:Math.min(100,Math.round(R.navigation.path_efficiency*100)),'%'),
          'driven distance vs shortest path — planner quality')}
    ${row('doorway traversals', n(R.navigation.doorway_traversals), 'the manoeuvre that fails most often in the field')}
    ${row('recovery manoeuvres', n(R.navigation.recovery_manoeuvres),
          'wedge-and-recover events — the top cause of real intervention calls')}

    <button class="btn" id="again">Run it back</button>
    <button class="btn ghost" id="dl">Download run log (JSON)</button>
    <button class="btn ghost" id="menu">Menu</button>`;
  document.getElementById('again').onclick=startGame;
  document.getElementById('menu').onclick=()=>{ state='menu'; menuCard(); };
  document.getElementById('dl').onclick=downloadRunLog;
  overlay.classList.remove('hidden');
  cardEl.scrollTop=0;
}

function downloadRunLog(){
  const blob=new Blob([JSON.stringify(TEL.report(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ward-runner-shift-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function startGame(){
  audio(); resetGame(); state='play'; overlay.classList.add('hidden');
  grabMouse();
}
function pauseGame(){
  if(state!=='play') return;
  state='pause'; pauseCard();
  if(document.pointerLockElement) document.exitPointerLock();
}
function endGame(){
  state='over'; sfxEnd(); overCard();
  if(document.pointerLockElement) document.exitPointerLock();
}

/* ==================================================================== LOOP */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;

  if(state==='play'){
    updatePlayer(dt);
    updateHumans(dt);
    updateTask(dt);
    TEL.sample(dt);
    time-=dt; elapsed+=dt;
    // proximity beeps
    if(nearestDist<2.6){
      beepCd-=dt;
      if(beepCd<=0){ sfxBeep(clamp(1-nearestDist/2.6,0,1)); beepCd=clamp(nearestDist*0.30,0.08,0.7); }
    }
    updatePanels(dt);
    if(time<=0){ time=0; endGame(); }
  }
  render();
  drawHUD();
}

/* =================================================================== BOOT */
buildTextures();
buildSprites();
buildMap();
resize();
newTask();
menuCard();
requestAnimationFrame(loop);
</script>
</body>
</html>
